plugins {
    id 'com.android.application'
}

android {
    namespace 'net.classcardauto.auth'
    compileSdk 35
    defaultConfig {
        applicationId 'net.classcardauto.mobile.authenticator'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false }
    applicationVariants.all { variant ->
        variant.outputs.all { outputFileName = "MiMiC-Auth-V${variant.versionName}.apk" }
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
}
