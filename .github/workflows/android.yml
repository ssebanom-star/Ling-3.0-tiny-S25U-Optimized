name: android

on:
  push:
    branches: [ main, "ccr-*" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install NDK / CMake
        run: sdkmanager --install "ndk;29.0.14206865" "cmake;3.31.6" "platforms;android-36" "build-tools;36.0.0"

      - name: Chat template goldens up to date
        run: |
          pip install jinja2
          python3 tools/template/gen_goldens.py > /tmp/goldens.json
          diff -u app/src/test/resources/template_goldens.json /tmp/goldens.json

      - name: JVM unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Host engine build (compile check)
        run: |
          cmake -S tests/host -B build-host -DCMAKE_BUILD_TYPE=Release -G Ninja || \
          cmake -S tests/host -B build-host -DCMAKE_BUILD_TYPE=Release
          cmake --build build-host -j4 --target ling_engine_test

      # NPU(Hexagon) 백엔드 포함: Qualcomm snapdragon-toolchain 이미지(Hexagon SDK 포함)로 빌드
      - name: Hexagon backend
        run: tools/build_hexagon_backend.sh

      - name: Release APK (CPU + Adreno OpenCL + Hexagon)
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: ling-s25u-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
