org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# --- 네이티브 빌드 옵션 (engine/build.gradle.kts 참조) ---
# Adreno GPU(OpenCL) 백엔드 포함 여부. 빌드 시 OpenCL 헤더/ICD 로더를 내려받는다
ling.opencl=true
# Arm KleidiAI 커널 (빌드 시 소스 다운로드). 실기기 벤치 전까지 기본 off
ling.kleidiai=false
